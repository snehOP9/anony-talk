version: 2
updates:
  - package-ecosystem: npm
    directory: /anony-talk-fullstack/client
    schedule:
      interval: weekly
      day: friday
      time: "06:00"
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /anony-talk-fullstack/server
    schedule:
      interval: weekly
      day: friday
      time: "06:15"
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: friday
      time: "06:30"
    open-pull-requests-limit: 5
